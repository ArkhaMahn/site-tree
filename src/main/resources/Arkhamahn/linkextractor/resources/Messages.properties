linkextractor.desc = Burp-style link extraction at the network layer.\n\
Every in-scope response ZAP receives (proxied browsing, spider, AJAX spider, active scan) \
is inspected the moment it arrives;\n\
all URLs and endpoint-looking string literals in HTML/JS/CSS/JSON/XML bodies \
are resolved and added to the Site tree as unrequested (TYPE_ZAP_USER) entries \
with an empty response and a "Discovered via passive link extraction - NOT requested" note.\n\
No request is ever sent to the discovered URLs.\n\
Cross-host candidates are added as new subdomain folder nodes flagged with a "[NEW SUBDOMAIN]" note.\n\
Because it hooks the network layer (HttpSenderListener) and runs inline on the request/proxy thread, \
the tree populates immediately when a domain is visited, with no dependency on the passive scan queue.\n\
JavaScript parsing, subdomain discovery from body links, subdomain discovery from HTTP \
response headers, and recording the discovered links and subdomains in the history tab \
can each be toggled under Tools > Options > Site tree.\n\
The same panel sets how many worker threads are used and the largest response body that is \
scanned at all (default 5 MB).
linkextractor.name = Site tree
linkextractor.scanner.name = Link Extractor (Site Tree)

linkextractor.options.title = Site tree
linkextractor.options.label.intro = <html><body style="width: 400px;">Link extraction runs on every in-scope response ZAP receives.<br><br>Discovered URLs are added to the Site tree without sending any request to them.<br><br>They can optionally also be recorded in the history tab.</body></html>
linkextractor.options.label.parseJavascript = Parse JavaScript for endpoints and links (fetch, axios, XHR, template literals, API path literals)
linkextractor.options.label.discoverSubdomains = Discover subdomains (add cross-host links as new folder nodes in the Site tree)
linkextractor.options.label.discoverSubdomainsFromHeaders = Discover subdomains from HTTP response headers (e.g. CSP, Link, Set-Cookie; supports wildcards like *.example.com)
linkextractor.options.label.recordInProxyHistory = Record discovered links and subdomains in the history tab
linkextractor.options.label.threads = Number of threads:
linkextractor.options.label.threads.tooltip = Number of concurrent worker threads for link extraction (minimum 2)
linkextractor.options.label.maxBodySizeMb = Maximum response body size to scan (MB):
linkextractor.options.label.maxBodySizeMb.tooltip = Responses whose body is larger than this are not scanned at all. The body has to be copied on the network thread and decoded on a worker thread, so this keeps a very large download, media file or source map from being processed. 1-100 MB, default 5 MB
